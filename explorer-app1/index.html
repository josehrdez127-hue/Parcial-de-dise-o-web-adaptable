<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Where in the world?</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Iconos -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900">

    <!-- ================= HEADER ================= -->
    <header class="relative h-20 bg-white border-b border-slate-200">

        <div class="max-w-7xl mx-auto h-full px-6 md:px-8 flex items-center justify-between">

            <!-- Logo -->
            <div class="flex items-center gap-3">

                <img
                    src="/world.svg"
                    alt=""
                    class="w-8 h-8"
                    aria-hidden="true">

                <span class="font-bold text-lg">
                    Where in the world?
                </span>

            </div>


            <!-- Navegación móvil -->
            <button
                id="menu-toggle"
                type="button"
                class="md:hidden p-2 text-slate-600 hover:text-blue-600"
                aria-label="Abrir menú"
                aria-controls="main-menu"
                aria-expanded="false">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>

            <!-- Navegación -->
            <nav
                id="main-menu"
                class="hidden absolute top-20 left-0 right-0 z-10
                       flex-col gap-5 bg-white border-b border-slate-200
                       px-6 py-5 text-sm md:static md:flex md:flex-row
                       md:items-center md:gap-8 md:border-0 md:p-0">

                <a href="#"
                   class="text-slate-600 hover:text-blue-600 transition">
                    Inicio
                </a>

                <a href="#"
                   class="font-semibold text-blue-600">
                    Explorar países
                </a>

                <a href="#"
                   class="text-slate-600 hover:text-blue-600 transition">
                    Acerca de
                </a>

            </nav>

        </div>

    </header>


    <!-- ================= CONTENIDO ================= -->
    <main class="max-w-7xl mx-auto px-6 md:px-8 py-14">

        <!-- Título -->
        <section class="mb-10">

            <h1 class="text-4xl font-bold tracking-tight mb-3">
                Explorar países del mundo
            </h1>

            <p class="text-slate-600 text-base">
                Busca un país o filtra por región para consultar su información
            </p>

        </section>


        <!-- ================= FILTROS ================= -->
        <section class="flex flex-col md:flex-row
                        justify-between gap-5 mb-10">

            <!-- Buscador -->
            <div class="relative w-full md:w-120">

                  <i data-lucide="search"
                     class="absolute left-4 top-1/2
                         -translate-y-1/2
                         w-5 h-5 text-slate-500">
                  </i>

                <input
                    id="country-search"
                    type="text"
                    placeholder="Escriba el nombre del país..."
                    class="w-full h-14 pl-12 pr-4
                           bg-white border border-slate-200
                           rounded-xl outline-none
                           focus:border-blue-500
                           focus:ring-2
                           focus:ring-blue-100
                           transition"
                >

            </div>


            <!-- Región -->
            <select
                id="region-filter"
                class="w-full md:w-60 h-14 px-4
                       bg-white border border-slate-200
                       rounded-xl outline-none
                       focus:border-blue-500
                       focus:ring-2
                       focus:ring-blue-100">

                <option value="all">Busque por región</option>
                <option value="Americas">América</option>
                <option value="Europe">Europa</option>
                <option value="Asia">Asia</option>
                <option value="Africa">África</option>
                <option value="Oceania">Oceanía</option>

            </select>

        </section>


        <!-- ================= TARJETAS ================= -->
        <section
            id="countries-grid"
            class="grid grid-cols-1 sm:grid-cols-2
                   lg:grid-cols-4 gap-6">
        </section>

    </main>


    <script type="module" src="/src/main.ts"></script>

</body>
</html>
